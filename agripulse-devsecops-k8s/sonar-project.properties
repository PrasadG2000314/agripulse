# ==============================================================================
# SonarQube / SonarCloud Static Code Analysis Configuration (DevSecOps SAST)
# ==============================================================================

# SonarCloud / GitHub Organization & Project Key
sonar.organization=prasadg2000314
sonar.projectKey=PrasadG2000314_agripulse-devsecops-k8s
sonar.projectName=agripulse-devsecops-k8s
sonar.projectVersion=1.0.0

# SonarCloud Service Endpoint (sonarcloud.io)
sonar.host.url=https://sonarcloud.io

# SCM / GitHub Repository Links
sonar.links.homepage=https://github.com/PrasadG2000314/agripulse-devsecops-k8s
sonar.links.scm=https://github.com/PrasadG2000314/agripulse-devsecops-k8s

# Source code directories
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Code analysis exclusions (Exclude 3rd-party dependencies, Kubernetes manifests, CI configs)
sonar.exclusions=**/node_modules/**,**/k8s/**,**/.github/**,**/coverage/**,**/dist/**

# JavaScript Analysis settings
sonar.javascript.node.maxspace=4096
sonar.javascript.environments=nodejs

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
